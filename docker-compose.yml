# Portal Iprevicon — produção atrás de reverse proxy
#
#   cp .env.example .env   # ajuste BASE_PATH / SEGURADO_*
#   docker compose up -d --build

services:
  portal:
    container_name: portal-iprevicon
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BASE_PATH: ${BASE_PATH:-}
      NODE_OPTIONS: --max-old-space-size=256
      SEGURADO_SYSTEM_URL: ${SEGURADO_SYSTEM_URL:-}
      SEGURADO_SYSTEM_NAME: ${SEGURADO_SYSTEM_NAME:-Sistema do Segurado}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000${BASE_PATH:-}/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
