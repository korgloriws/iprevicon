# Portal Iprevicon — VPS Hostinger (São Paulo)
# URL: http://31.97.167.75:3090
#
#   cp .env.example .env
#   docker-compose up -d --build
#   docker-compose logs -f portal

version: "3.8"

services:
  portal:
    container_name: portal-iprevicon
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host 3090 → container 3000
      - "3090:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_OPTIONS: --max-old-space-size=256
      SEGURADO_SYSTEM_URL: ${SEGURADO_SYSTEM_URL:-}
      SEGURADO_SYSTEM_NAME: ${SEGURADO_SYSTEM_NAME:-Sistema do Segurado}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
